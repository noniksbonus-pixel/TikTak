<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Крестики-нолики</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
    overflow: hidden; transition: background 0.6s;
    background: #1e2a44; padding: 16px;
  }
  body.bg-forest { background: radial-gradient(circle at 30% 20%, #2e6b3a, #0d2a17 70%); }
  body.bg-sea { background: linear-gradient(180deg, #0a3d62 0%, #1e6f9f 50%, #0a3d62 100%); background-size: 100% 200%; animation: waves 8s ease-in-out infinite; }
  body.bg-space { background: radial-gradient(circle at 70% 30%, #2b1a4d, #05010f 75%); }
  @keyframes waves { 0%,100%{background-position:0 0;} 50%{background-position:0 50%;} }

  .bg-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-forest-layer::before, .bg-forest-layer::after { content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #b8ff8a; box-shadow: 12vw 20vh 0 0 #b8ff8a, 25vw 70vh 0 0 #d4ff9a, 40vw 35vh 0 0 #9affb0, 60vw 80vh 0 0 #b8ff8a, 75vw 25vh 0 0 #d4ff9a, 88vw 60vh 0 0 #9affb0, 50vw 15vh 0 0 #b8ff8a, 15vw 85vh 0 0 #9affb0; animation: fireflies 5s ease-in-out infinite alternate; }
  .bg-forest-layer::after { animation-delay: 2.5s; opacity: .7; }
  @keyframes fireflies { 0%{transform:translateY(0);opacity:.3;} 100%{transform:translateY(-18px);opacity:1;} }

  .bg-sea-layer::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 80%, rgba(255,255,255,.12) 0 3px, transparent 4px), radial-gradient(circle at 60% 90%, rgba(255,255,255,.10) 0 2px, transparent 3px), radial-gradient(circle at 80% 75%, rgba(255,255,255,.10) 0 4px, transparent 5px); background-size: 200px 200px, 150px 150px, 250px 250px; animation: bubbles 12s linear infinite; }
  @keyframes bubbles { from{background-position:0 0,0 0,0 0;} to{background-position:0 -200px,0 -150px,0 -250px;} }

  .bg-space-layer::before, .bg-space-layer::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(1.5px 1.5px at 20% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 15%, #cfe6ff, transparent), radial-gradient(1px 1px at 45% 60%, #fff, transparent), radial-gradient(2px 2px at 85% 70%, #ffe9b0, transparent), radial-gradient(1px 1px at 10% 80%, #fff, transparent), radial-gradient(1.5px 1.5px at 55% 40%, #b0d4ff, transparent); background-size: 250px 250px; animation: twinkle 4s ease-in-out infinite alternate; }
  .bg-space-layer::after { background-size: 350px 350px; animation-delay: 2s; opacity: .6; }
  @keyframes twinkle { 0%{opacity:.5;} 100%{opacity:1;} }

  .ui { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: 1px; }
  #difficulty { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
  #difficulty button { padding: 8px 16px; border: 1px solid rgba(255,255,255,.25); border-radius: 20px; background: rgba(255,255,255,.08); color: #fff; font-size: 14px; cursor: pointer; transition: all .2s; }
  #difficulty button:hover { background: rgba(255,255,255,.2); }
  #difficulty button.active { background: #57c7ff; color: #10203a; font-weight: 700; border-color: #57c7ff; }

  #status { margin-bottom: 12px; font-size: 16px; height: 22px; color: #9ad0ff; text-align: center; transition: color .2s; }

  #boardWrap { position: relative; }
  #board { display: grid; gap: 3px; background: rgba(0,0,0,.25); padding: 6px; border-radius: 12px; backdrop-filter: blur(3px); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .cell { position: relative; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.08); border-radius: 6px; cursor: pointer; user-select: none; font-weight: 700; transition: background .12s, transform .08s; }
  .cell:hover:not(.taken) { background: rgba(255,255,255,.2); }
  .cell:active:not(.taken) { transform: scale(0.94); }
  .cell.taken { cursor: default; }
  .cell.win { background: rgba(120,255,150,.35); animation: winPulse .6s ease-in-out infinite alternate; }
  @keyframes winPulse { from{box-shadow:0 0 0 rgba(120,255,150,0);} to{box-shadow:0 0 18px rgba(120,255,150,.8);} }

  .cell.x { filter: drop-shadow(0 0 6px rgba(87,199,255,.7)); }
  .cell.o { filter: drop-shadow(0 0 6px rgba(255,122,156,.7)); }

  .cell.elf::before { content: '🧝'; position: absolute; font-size: 1.4em; z-index: 5; animation: elfIn .4s ease-out; }
  @keyframes elfIn { from{transform:scale(0) rotate(-45deg);opacity:0;} to{transform:scale(1) rotate(0);opacity:1;} }

  .blackhole-sprite { position: fixed; z-index: 9; pointer-events: none; width: 64px; height: 64px; transform: translate(-50%, -50%); animation: bhAppear .6s ease-out; }
  @keyframes bhAppear { from { transform: translate(-50%,-50%) scale(0) rotate(0deg); opacity: 0; } to { transform: translate(-50%,-50%) scale(1) rotate(180deg); opacity: 1; } }
  .blackhole-sprite .core { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #000 0%, #0a0014 35%, #2a0b4a 60%, #6b2bd9 80%, #57c7ff 100%); box-shadow: 0 0 24px 6px rgba(107, 43, 217, .8), 0 0 60px 14px rgba(87, 199, 255, .4), inset 0 0 20px 6px rgba(0,0,0,.9); animation: bhSpin 1.2s linear infinite, bhPulse 1.6s ease-in-out infinite alternate; }
  .blackhole-sprite .ring { position: absolute; inset: -10px; border-radius: 50%; border: 2px dashed rgba(87, 199, 255, .7); animation: bhRingSpin 2s linear infinite; }
  .blackhole-sprite .ring2 { position: absolute; inset: -20px; border-radius: 50%; border: 1px solid rgba(180, 130, 255, .5); animation: bhRingSpin 3.4s linear infinite reverse; }
  @keyframes bhSpin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1); } }
  @keyframes bhRingSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes bhPulse { from { filter: brightness(1) saturate(1); } to { filter: brightness(1.4) saturate(1.4); } }

  .flying-piece { position: fixed; z-index: 7; pointer-events: none; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: none; }
  .flying-piece.x { filter: drop-shadow(0 0 10px rgba(87,199,255,.9)); }
  .flying-piece.o { filter: drop-shadow(0 0 10px rgba(255,122,156,.9)); }

  .fish-sprite { position: fixed; z-index: 8; font-size: 28px; pointer-events: none; transform-origin: center; }
  .arrow { position: fixed; z-index: 6; font-size: 22px; pointer-events: none; transform-origin: center; transition: none; }

  #restart { margin-top: 16px; padding: 9px 24px; font-size: 15px; border: none; border-radius: 10px; background: #57c7ff; color: #10203a; font-weight: 700; cursor: pointer; transition: background .15s; z-index: 2; }
  #restart:hover { background: #86d8ff; }

  .top-controls { position: fixed; top: 14px; right: 14px; z-index: 10; display: flex; align-items: center; gap: 10px; }
  #musicToggle { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.35); color: #fff; font-size: 18px; cursor: pointer; backdrop-filter: blur(4px); transition: background .15s, transform .1s; }
  #musicToggle:hover { background: rgba(255,255,255,.2); }
  #musicToggle:active { transform: scale(0.92); }

  #volumePanel { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.3); border-radius: 22px; padding: 0 14px 0 12px; height: 42px; backdrop-filter: blur(4px); }
  #volumePanel .icon { font-size: 16px; }
  #volumeSlider { -webkit-appearance: none; appearance: none; width: 110px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); outline: none; cursor: pointer; }
  #volumeSlider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #57c7ff; box-shadow: 0 0 8px rgba(87,199,255,.8); cursor: pointer; }
  #volumeSlider::-moz-range-thumb { width: 16px; height: 16px; border: none; border-radius: 50%; background: #57c7ff; box-shadow: 0 0 8px rgba(87,199,255,.8); cursor: pointer; }
  #volumeLabel { font-size: 12px; min-width: 30px; text-align: right; color: #9ad0ff; font-variant-numeric: tabular-nums; }

  #board.size-3 { grid-template-columns: repeat(3, 90px); grid-template-rows: repeat(3, 90px); }
  #board.size-3 .cell { font-size: 52px; }
  #board.size-6 { grid-template-columns: repeat(6, 62px); grid-template-rows: repeat(6, 62px); }
  #board.size-6 .cell { font-size: 40px; border-radius: 5px; }
  #board.size-10 { grid-template-columns: repeat(10, 40px); grid-template-rows: repeat(10, 40px); gap: 2px; }
  #board.size-10 .cell { font-size: 24px; border-radius: 4px; }

  @media (max-width: 600px) {
    #board.size-6 { grid-template-columns: repeat(6, minmax(0, 12vw)); grid-template-rows: repeat(6, minmax(0, 12vw)); }
    #board.size-10 { grid-template-columns: repeat(10, minmax(0, 8vw)); grid-template-rows: repeat(10, minmax(0, 8vw)); }
    #volumeSlider { width: 70px; }
    .top-controls { top: 8px; right: 8px; gap: 6px; }
    #volumePanel { padding: 0 10px; }
    .blackhole-sprite { width: 44px; height: 44px; }
  }
</style>
</head>
<body class="bg-forest">
<div class="bg-layer bg-forest-layer" id="bgLayer"></div>

<div class="top-controls">
  <div id="volumePanel" title="Общая громкость">
    <span class="icon">🔉</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
    <span id="volumeLabel">70%</span>
  </div>
  <button id="musicToggle" title="Музыка вкл/выкл">🔊</button>
</div>

<div class="ui">
  <h1>Крестики-нолики</h1>
  <div id="difficulty">
    <button data-mode="easy"   class="active">3×3 · Лес · Лёгкий</button>
    <button data-mode="medium">6×6 · Море · Средний</button>
    <button data-mode="hard">10×10 · Космос · Сложный</button>
  </div>
  <div id="status">Ваш ход (🐰)</div>
  <div id="boardWrap"><div id="board"></div></div>
  <button id="restart">Новая игра</button>
</div>

<script>
const MODES = {
  easy:   { size: 3, winLen: 3, bg: 'bg-forest', layer: 'bg-forest-layer', ai: 'minimax', symbols: { X: '🐰', O: '🐺' }, humanName: 'Кролик', aiName: 'Волк' },
  medium: { size: 6, winLen: 5, bg: 'bg-sea', layer: 'bg-sea-layer', ai: 'medium', symbols: { X: '🐠', O: '🐚' }, humanName: 'Рыба-клоун', aiName: 'Ракушка' },
  hard:   { size: 10, winLen: 7, bg: 'bg-space', layer: 'bg-space-layer', ai: 'hard', symbols: { X: '🚀', O: '☄️' }, humanName: 'Космический корабль', aiName: 'Метеорит' }
};

const HUMAN = 'X'; const AI = 'O';
let board, gameOver, cfg, modeKey, eventBusy = false;
const boardEl = document.getElementById('board'), statusEl = document.getElementById('status'), bgLayer = document.getElementById('bgLayer'), diffBtns = document.querySelectorAll('#difficulty button'), restartBtn = document.getElementById('restart'), musicBtn = document.getElementById('musicToggle'), volumeSlider = document.getElementById('volumeSlider'), volumeLabel = document.getElementById('volumeLabel');

function sym(player) { return cfg.symbols[player]; }
function humanSym() { return cfg.symbols.X; }

let audioCtx = null, masterGain = null, musicGain = null, musicEnabled = true, masterVolume = 0.7;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain(); masterGain.gain.value = masterVolume; masterGain.connect(audioCtx.destination);
    musicGain = audioCtx.createGain(); musicGain.gain.value = 0.18; musicGain.connect(masterGain);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function setMasterVolume(v) { masterVolume = Math.max(0, Math.min(1, v)); if (masterGain) masterGain.gain.value = masterVolume; }
function beep(freq, duration = 0.08, type = 'sine', vol = 0.15, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(vol, t + 0.01); gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain).connect(masterGain); osc.start(t); osc.stop(t + duration + 0.02);
}
const SFX = {
  place: () => beep(520, 0.07, 'triangle', 0.18), aiPlace: () => beep(380, 0.07, 'triangle', 0.15),
  win: () => { [523,659,784,1047].forEach((f,i)=>beep(f,0.18,'sine',0.18,i*0.12)); }, lose: () => { [392,330,262].forEach((f,i)=>beep(f,0.22,'sawtooth',0.14,i*0.16)); },
  draw: () => { [440,440].forEach((f,i)=>beep(f,0.15,'sine',0.12,i*0.2)); }, switch: () => beep(660, 0.05, 'square', 0.1), click: () => beep(300, 0.04, 'square', 0.08),
  arrow: () => { beep(1200, 0.05, 'square', 0.1); beep(400, 0.15, 'sawtooth', 0.12, 0.03); }, elf: () => { [880,1175,1568].forEach((f,i)=>beep(f,0.1,'sine',0.12,i*0.07)); },
  fish: () => { beep(300, 0.12, 'sine', 0.12); beep(450, 0.12, 'sine', 0.12, 0.1); beep(300, 0.12, 'sine', 0.12, 0.2); }, fishGrab: () => { beep(600, 0.08, 'sine', 0.15); beep(900, 0.1, 'sine', 0.12, 0.06); },
  hole: () => { beep(80, 0.8, 'sawtooth', 0.22); beep(60, 0.8, 'sawtooth', 0.18, 0.1); beep(120, 0.6, 'sine', 0.1, 0.2); }, suck: () => { beep(220, 0.25, 'sawtooth', 0.08); beep(160, 0.35, 'sawtooth', 0.06, 0.08); },
};

const Music = {
  timer: null, nextNoteTime: 0, step: 0, track: 'forest',
  TRACKS: {
    forest: { bpmStep: 0.55, gain: 0.16, scale: [220.00, 261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33], melodyChance: 0.55, padChords: [[220,277.18,329.63],[196,246.94,293.66],[174.61,220,261.63]], padEvery: 8, type: 'triangle' },
    sea: { bpmStep: 0.7, gain: 0.15, scale: [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25], melodyChance: 0.4, padChords: [[261.63,329.63,392.00],[220,261.63,329.63],[196,246.94,293.66]], padEvery: 10, type: 'sine' },
    space: { bpmStep: 0.9, gain: 0.14, scale: [261.63,293.66,329.63,369.99,415.30,466.16,523.25,587.33], melodyChance: 0.3, padChords: [[130.81,196.00,261.63],[146.83,220.00,293.66],[164.81,246.94,329.63]], padEvery: 12, type: 'sine' },
  },
  start(track) { if (!audioCtx) return; this.track = track; this.step = 0; this.nextNoteTime = audioCtx.currentTime + 0.1; if (this.timer) clearInterval(this.timer); this.timer = setInterval(() => this.scheduler(), 100); },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  scheduler() { if (!audioCtx || !musicEnabled) return; const lookahead = 0.3, cfg = this.TRACKS[this.track]; while (this.nextNoteTime < audioCtx.currentTime + lookahead) { this.playStep(this.step, this.nextNoteTime, cfg); this.nextNoteTime += cfg.bpmStep; this.step++; } },
  playStep(step, time, cfg) {
    if (Math.random() < cfg.melodyChance) { const note = cfg.scale[Math.floor(Math.random() * cfg.scale.length)]; this.playNote(note, time, 0.9, cfg.type, cfg.gain); if (Math.random() < 0.25) this.playNote(note*2, time+0.15, 0.5, cfg.type, cfg.gain*0.4); }
    if (step % cfg.padEvery === 0) { const chord = cfg.padChords[Math.floor(Math.random() * cfg.padChords.length)]; chord.forEach((f,i)=>this.playNote(f, time, cfg.bpmStep*cfg.padEvery*1.2, 'sine', cfg.gain*0.5, i*0.05)); }
    if (this.track === 'space' && step % 6 === 0 && Math.random() < 0.5) { const f = cfg.scale[Math.floor(Math.random() * cfg.scale.length)] * 4; this.playNote(f, time+0.2, 0.4, 'sine', cfg.gain*0.25); }
  },
  playNote(freq, when, duration, type, vol, delay = 0) { if (!audioCtx || !musicEnabled) return; const t = when + delay; const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, t); gain.gain.setValueAtTime(0, t); gain.gain.linearRampToValueAtTime(vol, t + 0.05); gain.gain.exponentialRampToValueAtTime(0.0001, t + duration); osc.connect(gain).connect(musicGain); osc.start(t); osc.stop(t + duration + 0.05); },
};

function setMode(key) { ensureAudio(); SFX.switch(); modeKey = key; cfg = MODES[key]; diffBtns.forEach(b => b.classList.toggle('active', b.dataset.mode === key)); document.body.className = cfg.bg; bgLayer.className = 'bg-layer ' + cfg.layer; Music.start({ easy: 'forest', medium: 'sea', hard: 'space' }[key]); init(); }
function init() { const n = cfg.size; board = Array(n * n).fill(''); gameOver = false; eventBusy = false; statusEl.textContent = `Ваш ход (${humanSym()})`; statusEl.style.color = '#9ad0ff'; boardEl.className = 'size-' + n; boardEl.innerHTML = ''; for (let i = 0; i < n * n; i++) { const cell = document.createElement('div'); cell.className = 'cell'; cell.addEventListener('click', () => humanMove(i)); boardEl.appendChild(cell); } render(); }
function render() { const cells = boardEl.children; for (let i = 0; i < board.length; i++) { const v = board[i], el = cells[i]; el.className = 'cell'; if (v) { el.classList.add('taken', v.toLowerCase()); el.textContent = sym(v); } else el.textContent = ''; } }

function humanMove(i) { ensureAudio(); if (gameOver || eventBusy || board[i] !== '') return; board[i] = HUMAN; SFX.place(); render(); if (checkEnd()) return; statusEl.textContent = `Ход компьютера...`; statusEl.style.color = '#ffb4c6'; setTimeout(() => { if (!gameOver) aiMove(); }, 300); }
function aiMove() { if (gameOver) return; let idx = cfg.ai === 'minimax' ? bestMinimax(board) : bestHeuristic(board, cfg); if (idx == null || idx < 0) { const empty = board.map((v,i)=>v===''?i:null).filter(v=>v!==null); idx = empty[Math.floor(Math.random()*empty.length)]; } board[idx] = AI; SFX.aiPlace(); render(); if (checkEnd()) return; maybeTriggerEvent(); }

function maybeTriggerEvent() { if (gameOver) return; let chance = 0, handler = null; if (cfg.size === 3) { chance = 0.25; handler = elfEvent; } if (cfg.size === 6) { chance = 0.20; handler = fishEvent; } if (cfg.size === 10) { chance = 0.05; handler = blackHoleEvent; } if (!handler) return; if (Math.random() < chance) { eventBusy = true; statusEl.textContent = 'Событие на поле!'; statusEl.style.color = '#ffd97d'; setTimeout(() => handler(), 200); } else { statusEl.textContent = `Ваш ход (${humanSym()})`; statusEl.style.color = '#9ad0ff'; } }

function elfEvent() {
  const n = 3, occupied = board.map((v,i)=>v?i:null).filter(v=>v!==null); if (occupied.length === 0) { endEvent(); return; }
  const empties = board.map((v,i)=>v===''?i:null).filter(v=>v!==null); const elfPos = empties.length ? empties[Math.floor(Math.random()*empties.length)] : Math.floor(Math.random()*board.length);
  boardEl.children[elfPos].classList.add('elf'); SFX.elf();
  const er = Math.floor(elfPos/n), ec = elfPos%n; const candidates = occupied.filter(idx => { const r = Math.floor(idx/n), c = idx%n; return r === er || c === ec || Math.abs(r-er) === Math.abs(c-ec); });
  const target = candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : occupied[Math.floor(Math.random()*occupied.length)];
  setTimeout(() => { shootArrow(elfPos, target, () => { board[target] = ''; boardEl.children[target].classList.add('shot'); SFX.suck(); setTimeout(() => { render(); endEvent(); }, 400); }); }, 350);
}
function shootArrow(fromIdx, toIdx, onHit) { const fromEl = boardEl.children[fromIdx], toEl = boardEl.children[toIdx]; const fr = fromEl.getBoundingClientRect(), tr = toEl.getBoundingClientRect(); const arrow = document.createElement('div'); arrow.className = 'arrow'; arrow.textContent = '➤'; const sx = fr.left + fr.width/2, sy = fr.top + fr.height/2; const ex = tr.left + tr.width/2, ey = tr.top + tr.height/2; arrow.style.left = sx + 'px'; arrow.style.top = sy + 'px'; const angle = Math.atan2(ey-sy, ex-sx) * 180/Math.PI; arrow.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`; document.body.appendChild(arrow); SFX.arrow(); const dur = 350; arrow.animate([{ left: sx+'px', top: sy+'px' }, { left: ex+'px', top: ey+'px' }], { duration: dur, easing: 'ease-in' }); setTimeout(() => { arrow.remove(); onHit(); }, dur); }

function fishEvent() {
  const n = 6, occupied = board.map((v,i)=>v?i:null).filter(v=>v!==null); if (occupied.length === 0) { endEvent(); return; }
  const empties = board.map((v,i)=>v===''?i:null).filter(v=>v!==null); if (empties.length < 2) { endEvent(); return; }
  const fishStart = empties[Math.floor(Math.random()*empties.length)]; const fsr = Math.floor(fishStart/n), fsc = fishStart%n;
  let target = occupied[0], bestDist = Infinity; for (const idx of occupied) { const r = Math.floor(idx/n), c = idx%n; const d = Math.abs(r-fsr) + Math.abs(c-fsc); if (d < bestDist) { bestDist = d; target = idx; } }
  const destCandidates = empties.filter(i => i !== fishStart && i !== target); if (destCandidates.length === 0) { endEvent(); return; }
  const dest = destCandidates[Math.floor(Math.random()*destCandidates.length)];
  const fishEl = document.createElement('div'); fishEl.className = 'fish-sprite'; fishEl.textContent = '🐟'; document.body.appendChild(fishEl); SFX.fish();
  const cellCenter = (idx) => { const el = boardEl.children[idx]; const r = el.getBoundingClientRect(); return { x: r.left + r.width/2, y: r.top + r.height/2 }; };
  const startPt = cellCenter(fishStart); fishEl.style.left = startPt.x + 'px'; fishEl.style.top = startPt.y + 'px'; fishEl.style.transform = 'translate(-50%,-50%)';
  const targetPt = cellCenter(target), destPt = cellCenter(dest); let flyingEl = null;
  animateFish(fishEl, startPt, targetPt, 450, () => {
    const piece = board[target]; boardEl.children[target].textContent = ''; boardEl.children[target].className = 'cell';
    flyingEl = document.createElement('div'); flyingEl.className = 'flying-piece ' + piece.toLowerCase(); flyingEl.textContent = sym(piece); flyingEl.style.fontSize = getComputedStyle(boardEl.children[target]).fontSize || '34px'; flyingEl.style.left = targetPt.x + 'px'; flyingEl.style.top = targetPt.y + 'px'; flyingEl.style.transform = 'translate(-50%,-50%)'; document.body.appendChild(flyingEl); SFX.fishGrab();
    animateFish(fishEl, targetPt, destPt, 550, () => {
      if (flyingEl) { flyingEl.style.left = destPt.x + 'px'; flyingEl.style.top = destPt.y + 'px'; }
      fishEl.animate([{ transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(0.2) rotate(180deg)', opacity: 0 }], { duration: 300, easing: 'ease-in' });
      if (flyingEl) { flyingEl.animate([{ transform: 'translate(-50%,-50%) scale(1)' }, { transform: 'translate(-50%,-50%) scale(1.15)' }, { transform: 'translate(-50%,-50%) scale(1)' }], { duration: 300, easing: 'ease-out' }); }
      SFX.fish(); setTimeout(() => { fishEl.remove(); if (flyingEl) flyingEl.remove(); board[target] = ''; board[dest] = piece; render(); endEvent(); }, 320);
    }, flyingEl);
  });
}
function animateFish(fishEl, a, b, duration, onDone, flyingEl) { const start = performance.now(); function step(now) { const t = Math.min(1, (now - start) / duration); const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; const x = a.x + (b.x - a.x) * e, y = a.y + (b.y - a.y) * e; fishEl.style.left = x + 'px'; fishEl.style.top = y + 'px'; const wobble = Math.sin(t * Math.PI * 6) * 6; fishEl.style.transform = `translate(-50%,-50%) translateY(${wobble}px) rotate(${(b.x-a.x) < 0 ? -10 : 10}deg)`; if (flyingEl) { flyingEl.style.left = x + 'px'; flyingEl.style.top = (y - 22) + 'px'; } if (t < 1) requestAnimationFrame(step); else onDone && onDone(); } requestAnimationFrame(step); }

function blackHoleEvent() {
  const n = 10, empties = board.map((v,i)=>v===''?i:null).filter(v=>v!==null); if (empties.length === 0) { endEvent(); return; }
  const holePos = empties[Math.floor(Math.random()*empties.length)]; const hr = Math.floor(holePos/n), hc = holePos%n;
  const holeCellRect = boardEl.children[holePos].getBoundingClientRect(); const holeCX = holeCellRect.left + holeCellRect.width / 2, holeCY = holeCellRect.top + holeCellRect.height / 2;
  const holeEl = document.createElement('div'); holeEl.className = 'blackhole-sprite'; holeEl.innerHTML = '<div class="core"></div><div class="ring"></div><div class="ring2"></div>'; holeEl.style.left = holeCX + 'px'; holeEl.style.top = holeCY + 'px'; document.body.appendChild(holeEl); SFX.hole();
  setTimeout(() => {
    const candidates = []; for (let r = Math.max(0,hr-5); r <= Math.min(n-1,hr+5); r++) { for (let c = Math.max(0,hc-5); c <= Math.min(n-1,hc+5); c++) { const dist = Math.abs(r-hr) + Math.abs(c-hc); if (dist > 5) continue; const idx = r*n + c; if (board[idx]) candidates.push({ idx, dist }); } }
    if (candidates.length === 0) { holeEl.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(0)', opacity: 0 }], { duration: 400, easing: 'ease-in' }); setTimeout(() => { holeEl.remove(); endEvent(); }, 420); return; }
    candidates.sort((a,b) => a.dist - b.dist); const toSuck = candidates.slice(0, 5).map(o => o.idx); let maxDuration = 0;
    toSuck.forEach((idx, k) => {
      const cellEl = boardEl.children[idx], piece = board[idx]; const rect = cellEl.getBoundingClientRect(); const sx = rect.left + rect.width/2, sy = rect.top + rect.height/2;
      const flyer = document.createElement('div'); flyer.className = 'flying-piece ' + piece.toLowerCase(); flyer.textContent = sym(piece); flyer.style.fontSize = getComputedStyle(cellEl).fontSize || '24px'; flyer.style.left = sx + 'px'; flyer.style.top = sy + 'px'; flyer.style.transform = 'translate(-50%,-50%)'; document.body.appendChild(flyer);
      cellEl.textContent = ''; cellEl.className = 'cell';
      const dx = holeCX - sx, dy = holeCY - sy, dist = Math.hypot(dx, dy); const baseDur = 500, dur = baseDur + dist * 1.2, delay = k * 60; maxDuration = Math.max(maxDuration, delay + dur);
      const start = performance.now() + delay;
      function fly(now) { const t = Math.max(0, Math.min(1, (now - start) / dur)); const e = t * t; const x = sx + dx * e, y = sy + dy * e; const scale = 1 - e * 0.95, rot = e * 540; flyer.style.left = x + 'px'; flyer.style.top = y + 'px'; flyer.style.transform = `translate(-50%,-50%) scale(${scale}) rotate(${rot}deg)`; flyer.style.opacity = (1 - e * 0.9).toFixed(3); if (t < 1) requestAnimationFrame(fly); else { flyer.remove(); SFX.suck(); board[idx] = ''; } } requestAnimationFrame(fly);
    });
    setTimeout(() => { holeEl.animate([{ transform: 'translate(-50%,-50%) scale(1) rotate(0deg)', opacity: 1 }, { transform: 'translate(-50%,-50%) scale(0) rotate(360deg)', opacity: 0 }], { duration: 500, easing: 'ease-in' }); setTimeout(() => { holeEl.remove(); render(); endEvent(); }, 520); }, maxDuration + 100);
  }, 700);
}

function endEvent() { eventBusy = false; render(); if (!checkEnd()) { statusEl.textContent = `Ваш ход (${humanSym()})`; statusEl.style.color = '#9ad0ff'; } }

function getWinLine(b) { const n = cfg.size, need = cfg.winLen, dirs = [[1,0],[0,1],[1,1],[1,-1]]; for (let r = 0; r < n; r++) { for (let c = 0; c < n; c++) { const p = b[r*n + c]; if (!p) continue; for (const [dc, dr] of dirs) { let line = [], ok = true; for (let k = 0; k < need; k++) { const rr = r + dr*k, cc = c + dc*k; if (rr < 0 || rr >= n || cc < 0 || cc >= n || b[rr*n+cc] !== p) { ok = false; break; } line.push(rr*n + cc); } if (ok) return { player: p, line }; } } } return null; }

function checkEnd() {
  const res = getWinLine(board);
  if (res) {
    gameOver = true; highlight(res.line);
    if (res.player === HUMAN) { statusEl.textContent = `Победил ${cfg.humanName}! 🎉`; statusEl.style.color = '#7dffa8'; SFX.win(); }
    else { statusEl.textContent = `Победил ${cfg.aiName}! 🤖`; statusEl.style.color = '#ff9ab0'; SFX.lose(); }
    return true;
  }
  if (board.every(v => v !== '')) { gameOver = true; statusEl.textContent = 'Ничья 🤝'; statusEl.style.color = '#ffd97d'; SFX.draw(); return true; }
  return false;
}
function highlight(line) { const cells = boardEl.children; line.forEach(i => cells[i].classList.add('win')); }

function bestMinimax(b) { const avail = b.map((v,i)=>v===''?i:null).filter(v=>v!==null); let bestScore = -Infinity, bestMove = avail[0]; for (const idx of avail) { b[idx] = AI; const score = minimax(b, false); b[idx] = ''; if (score > bestScore) { bestScore = score; bestMove = idx; } } return bestMove; }
function minimax(b, isMax) { const res = getWinLine(b); if (res) return res.player === AI ? 10 : -10; if (b.every(v => v !== '')) return 0; if (isMax) { let best = -Infinity; for (let i = 0; i < b.length; i++) if (b[i] === '') { b[i] = AI; best = Math.max(best, minimax(b, false)); b[i] = ''; } return best; } else { let best = Infinity; for (let i = 0; i < b.length; i++) if (b[i] === '') { b[i] = HUMAN; best = Math.min(best, minimax(b, true)); b[i] = ''; } return best; } }
function bestHeuristic(b, conf) { const n = conf.size, empty = b.map((v,i)=>v===''?i:null).filter(v=>v!==null); if (empty.length === 0) return -1; for (const i of empty) { b[i] = AI; if (getWinLine(b)) { b[i] = ''; return i; } b[i] = ''; } for (const i of empty) { b[i] = HUMAN; if (getWinLine(b)) { b[i] = ''; return i; } b[i] = ''; } let bestScore = -Infinity, bestMoves = []; for (const i of empty) { let score = scoreCell(b, i, AI, conf) * 2.0 + scoreCell(b, i, HUMAN, conf) * 1.1 + centerBias(i, n) * 0.3; if (conf.ai === 'hard') score += Math.random() * 0.5; else score += Math.random() * 1.5; if (score > bestScore + 1e-9) { bestScore = score; bestMoves = [i]; } else if (Math.abs(score - bestScore) < 1e-9) bestMoves.push(i); } return bestMoves[Math.floor(Math.random() * bestMoves.length)]; }
function scoreCell(b, idx, player, conf) { const n = conf.size, need = conf.winLen, r = Math.floor(idx / n), c = idx % n, dirs = [[1,0],[0,1],[1,1],[1,-1]]; let total = 0; for (const [dc, dr] of dirs) { for (let offset = 0; offset < need; offset++) { let own = 0, opp = 0, valid = true; for (let k = 0; k < need; k++) { const rr = r + dr*(k - offset), cc = c + dc*(k - offset); if (rr < 0 || rr >= n || cc < 0 || cc >= n) { valid = false; break; } const v = b[rr*n + cc]; if (v === player) own++; else if (v !== '') opp++; } if (!valid) continue; if (opp === 0) { if (own === need - 1) total += 1000; else if (own === need - 2) total += 100; else if (own === need - 3) total += 10; else total += 1; total += own * 2; } } } return total; }
function centerBias(idx, n) { const r = Math.floor(idx / n), c = idx % n, mid = (n - 1) / 2, d = Math.abs(r - mid) + Math.abs(c - mid); return Math.max(0, n - d); }

diffBtns.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode)));
restartBtn.addEventListener('click', () => { ensureAudio(); SFX.click(); init(); });
musicBtn.addEventListener('click', () => { ensureAudio(); musicEnabled = !musicEnabled; musicBtn.textContent = musicEnabled ? '🔊' : '🔇'; if (musicEnabled) Music.start(Music.track); else Music.stop(); });
volumeSlider.addEventListener('input', (e) => { ensureAudio(); const v = parseInt(e.target.value, 10) / 100; setMasterVolume(v); volumeLabel.textContent = e.target.value + '%'; });
setMasterVolume(volumeSlider.value / 100); volumeLabel.textContent = volumeSlider.value + '%';
document.addEventListener('click', ensureAudio, { once: true });
setMode('easy');
document.addEventListener('click', () => { if (audioCtx && audioCtx.state === 'running' && !Music.timer) Music.start(Music.track); }, { once: true });
